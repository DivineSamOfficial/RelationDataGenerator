         nouns: [Tote Bag, Sling Bag, Laptop Backpack], colours: [Black, Tan, Maroon]}
      - {code: FASH-ACC-BLT, name: Belts & Wallets, share: 3, hsn: "42033000", gst: {before: 18, after: 18}, uom: PCS,
         mrp: {ECONOMY: [249, 599], MID: [600, 1499], PREMIUM: [1500, 3999]}, weight_kg: [0.08, 0.3], volume_litres: [0.3, 1.5],
         nouns: [Leather Belt, Bifold Wallet, Card Holder], colours: [Black, Brown]}
