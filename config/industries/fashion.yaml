         variants: [{label: UK 6, price_factor: 1.0}, {label: UK 7, price_factor: 1.0}, {label: UK 8, price_factor: 1.0}, {label: UK 9, price_factor: 1.0}]}
  - code: FASH-ACC
    name: Accessories
    return_window_days: 15
    children:
      - {code: FASH-ACC-BAG, name: Handbags & Backpacks, share: 4, hsn: "42022290", gst: {before: 18, after: 18}, uom: PCS,
