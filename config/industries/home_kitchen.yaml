# Industry pack: Home & Kitchen (1A §8.3). Format: see electronics.yaml.
# Mixed GST slabs, festive and wedding-season spikes, bulky / fragile items with higher damage rates.
# Brand names are invented; GST rates are illustrative (D17 pattern), not tax advice.

code: home_kitchen
name: Home & Kitchen
business_unit: {code: HOME, name: Home & Kitchen}

customers:
  b2b_sales_share: 0.70
  credit_terms:
    B2B: {NET30: 0.50, NET45: 0.20, NET15: 0.20, 2_10_NET30: 0.10}
    B2C: {ADVANCE: 0.70, COD: 0.30}
  sales_channels:
    B2B: {FIELD_SALES: 0.40, PHONE: 0.25, WHATSAPP: 0.20, WEBSITE: 0.15}
    B2C: {WEBSITE: 0.25, MOBILE_APP: 0.20, MARKETPLACE: 0.35, RETAIL_STORE: 0.15, WHATSAPP: 0.05}
  marketing_channels:
    B2B: {FIELD_SALES: 0.40, TRADE_SHOW: 0.20, REFERRAL: 0.20, DIRECT: 0.20}
    B2C: {FACEBOOK: 0.15, INSTAGRAM: 0.15, YOUTUBE: 0.10, GOOGLE_ADS: 0.15, MARKETPLACE_ADS: 0.15,
          ORGANIC_SEARCH: 0.10, EMAIL: 0.05, REFERRAL: 0.07, DIRECT: 0.08}
marketplace_commission_percent: 15

seasonality: [0.95, 0.90, 0.95, 1.05, 1.10, 0.85, 0.80, 0.85, 1.00, 1.35, 1.25, 0.95]
events:
  - {name: New Home Fest, month: 1, day: 10, days: 10, uplift: 1.15, channels: [FACEBOOK, GOOGLE_ADS]}
  - {name: Akshaya Tritiya Offers, month: 4, day: 20, days: 7, uplift: 1.25, channels: [INSTAGRAM, FACEBOOK]}
  - {name: Wedding Season Gifting, month: 5, day: 1, days: 21, uplift: 1.20, channels: [INSTAGRAM, EMAIL]}
  - {name: Monsoon Home Makeover, month: 7, day: 15, days: 14, uplift: 1.10, channels: [YOUTUBE, GOOGLE_ADS]}
  - {name: Big Festive Sale, month: 9, day: 25, days: 14, uplift: 1.50, channels: [MARKETPLACE_ADS, FACEBOOK]}
  - {name: Dhanteras Kitchen Week, month: 10, day: 18, days: 8, uplift: 1.70, channels: [INSTAGRAM, GOOGLE_ADS, EMAIL]}
  - {name: Housewares Trade Fair, month: 2, day: 10, days: 4, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Year End Clearance, month: 12, day: 22, days: 9, uplift: 1.15, channels: [EMAIL, MARKETPLACE_ADS]}

returns:
  b2c_return_rate: 0.05
  b2b_return_rate: 0.02
  defective_share: 0.30
  transit_damage_rate: 0.012           # glass and ceramics break in transit

suppliers:
