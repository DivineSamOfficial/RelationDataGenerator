# Industry pack: Packaged Food & FMCG (1A §8.3). Format: see electronics.yaml.
# Low-value, high-frequency, distributor-heavy B2B; short shelf lives (batch-tracked); 0-18% slabs.
# Food is not returnable once delivered (perishable). Brand names are invented; GST rates are
# illustrative (D17 pattern: e.g. biscuits 18% -> 5%, UHT milk 5% -> 0%), not tax advice.

code: fmcg
name: Packaged Food & FMCG
business_unit: {code: FMCG, name: Packaged Food & FMCG}

customers:
  b2b_sales_share: 0.85                # kirana stores, distributors, institutional buyers
  credit_terms:
    B2B: {NET15: 0.50, NET30: 0.30, IMMEDIATE: 0.20}
    B2C: {ADVANCE: 0.65, COD: 0.35}
  sales_channels:
    B2B: {FIELD_SALES: 0.55, WHATSAPP: 0.25, PHONE: 0.15, WEBSITE: 0.05}
    B2C: {MOBILE_APP: 0.35, WEBSITE: 0.15, MARKETPLACE: 0.20, RETAIL_STORE: 0.25, WHATSAPP: 0.05}
  marketing_channels:
    B2B: {FIELD_SALES: 0.55, REFERRAL: 0.20, TRADE_SHOW: 0.10, DIRECT: 0.15}
    B2C: {INSTAGRAM: 0.12, FACEBOOK: 0.15, YOUTUBE: 0.12, GOOGLE_ADS: 0.10, MARKETPLACE_ADS: 0.10,
          ORGANIC_SEARCH: 0.08, EMAIL: 0.08, REFERRAL: 0.10, DIRECT: 0.15}
marketplace_commission_percent: 10

seasonality: [1.00, 0.95, 1.00, 1.05, 1.05, 0.95, 0.95, 0.95, 1.00, 1.10, 1.05, 0.95]   # steady demand
events:
  - {name: Republic Day Grocery Deals, month: 1, day: 22, days: 5, uplift: 1.15, channels: [MARKETPLACE_ADS, FACEBOOK]}
  - {name: Summer Coolers, month: 4, day: 10, days: 30, uplift: 1.10, channels: [YOUTUBE, INSTAGRAM]}
  - {name: Monsoon Snack Fest, month: 7, day: 5, days: 21, uplift: 1.10, channels: [INSTAGRAM, FACEBOOK]}
  - {name: Raksha Bandhan Sweets, month: 8, day: 1, days: 10, uplift: 1.15, channels: [FACEBOOK, EMAIL]}
  - {name: Navratri Pantry Sale, month: 9, day: 28, days: 10, uplift: 1.20, channels: [MARKETPLACE_ADS, GOOGLE_ADS]}
  - {name: Diwali Gift Hampers, month: 10, day: 20, days: 14, uplift: 1.30, channels: [INSTAGRAM, EMAIL]}
  - {name: Distributor Scheme Launch, month: 4, day: 1, days: 5, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Year End Stock Up, month: 12, day: 20, days: 10, uplift: 1.10, channels: [EMAIL, GOOGLE_ADS]}

returns:
  b2c_return_rate: 0.01
  b2b_return_rate: 0.01                # near-expiry and damaged-carton returns from shops
  defective_share: 0.60
  transit_damage_rate: 0.005
  dispositions: {SCRAP: 0.85, RETURN_TO_SUPPLIER: 0.15, REPAIR: 0.00}   # defective stock, decided weekly (1D)

suppliers:
  hubs: [Indore, Ahmedabad, Kolkata, Ludhiana, Hyderabad, Nagpur, Coimbatore]
  name_suffixes: [Foods, Agro Products, Consumer Products, Dairy, Industries, Beverages]
  monthly_cost_drift: [0.003, 0.009]
  lead_time_days: [2, 10]

pricing:
  list_price_ratio: [0.80, 0.90]
  gross_margin: [0.08, 0.18]           # thin margins, high volume

brands:
  - {code: DHANYA, name: Dhanya Harvest, tier: MID, categories: [FMCG-STPL, FMCG-SNCK]}
  - {code: KHETIFRESH, name: Kheti Fresh, tier: ECONOMY, categories: [FMCG-STPL, FMCG-DAIRY]}
