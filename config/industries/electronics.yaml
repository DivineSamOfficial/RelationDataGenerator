      - {code: ELEC-MOB-PWB, name: Power Banks & Chargers, share: 6, hsn: "85076000", gst: {before: 18, after: 18}, uom: PCS,
         mrp: {ECONOMY: [399, 999], MID: [1000, 2499], PREMIUM: [2500, 5999]}, weight_kg: [0.1, 0.45], volume_litres: [0.2, 0.6],
         warranty_months: 6, nouns: [Power Bank 10000mAh, Power Bank 20000mAh, Fast Charger 33W, Fast Charger 65W]}
  - code: ELEC-CMP
    name: Computers & Accessories
    return_window_days: 10
    children:
      - {code: ELEC-CMP-LAP, name: Laptops, share: 5, hsn: "84713010", gst: {before: 18, after: 18}, uom: PCS,
