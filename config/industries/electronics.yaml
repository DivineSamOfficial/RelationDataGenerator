# Industry pack: Consumer Electronics (1A §8.3, D11). This file is the commented reference for the
# pack format; the other packs follow it. Everything here is data: the engine holds no industry logic.
#
# All brand names are invented. GST rates are illustrative for synthetic data (they follow the pattern
# of the 22 Sep 2025 rationalisation, D17: most 28% -> 18%, most 12% -> 5%), not tax advice.

code: electronics                      # = file name = business_units.industry_pack_code
name: Consumer Electronics
business_unit: {code: ELEC, name: Consumer Electronics}

customers:
  b2b_sales_share: 0.80                # share of NET SALES VALUE from B2B (D2, D23); counts are in presets
  credit_terms:                        # payment-term mix per customer type (shares sum to 1)
    B2B: {NET30: 0.45, NET45: 0.20, NET15: 0.25, 2_10_NET30: 0.10}
    B2C: {ADVANCE: 0.72, COD: 0.28}
  sales_channels:                      # order channel mix per customer type (D10)
    B2B: {FIELD_SALES: 0.45, PHONE: 0.20, WHATSAPP: 0.15, WEBSITE: 0.20}
    B2C: {WEBSITE: 0.25, MOBILE_APP: 0.25, MARKETPLACE: 0.30, RETAIL_STORE: 0.15, WHATSAPP: 0.05}
  marketing_channels:                  # acquisition / attribution mix per customer type
    B2B: {FIELD_SALES: 0.40, TRADE_SHOW: 0.15, REFERRAL: 0.20, DIRECT: 0.15, GOOGLE_ADS: 0.10}
    B2C: {GOOGLE_ADS: 0.20, YOUTUBE: 0.15, INSTAGRAM: 0.12, FACEBOOK: 0.08, MARKETPLACE_ADS: 0.15,
          ORGANIC_SEARCH: 0.12, EMAIL: 0.05, REFERRAL: 0.05, DIRECT: 0.08}
marketplace_commission_percent: 12

# Demand: 12 monthly factors (Jan..Dec, average 1.0) times the preset's orders_per_day.
seasonality: [1.05, 0.85, 0.85, 0.95, 1.00, 0.85, 0.85, 0.95, 1.05, 1.40, 1.35, 0.85]
# Sale events: create marketing campaigns (~8 a year, 1B §4.7) and lift demand while they run.
events:
  - {name: Republic Day Sale, month: 1, day: 20, days: 7, uplift: 1.30, channels: [GOOGLE_ADS, MARKETPLACE_ADS]}
  - {name: Summer Cooling Fest, month: 4, day: 1, days: 30, uplift: 1.15, channels: [GOOGLE_ADS, YOUTUBE]}
  - {name: Back to College, month: 7, day: 1, days: 21, uplift: 1.15, channels: [INSTAGRAM, YOUTUBE]}
  - {name: Independence Day Sale, month: 8, day: 10, days: 7, uplift: 1.25, channels: [GOOGLE_ADS, MARKETPLACE_ADS]}
  - {name: Big Festive Sale, month: 9, day: 25, days: 14, uplift: 1.60, channels: [MARKETPLACE_ADS, YOUTUBE, FACEBOOK]}
  - {name: Diwali Dhamaka, month: 10, day: 20, days: 14, uplift: 1.80, channels: [GOOGLE_ADS, INSTAGRAM, EMAIL]}
  - {name: Dealer Meet, month: 11, day: 15, days: 3, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Year End Sale, month: 12, day: 20, days: 10, uplift: 1.20, channels: [EMAIL, FACEBOOK]}

returns:
  b2c_return_rate: 0.07                # share of delivered B2C lines returned
  b2b_return_rate: 0.02
  defective_share: 0.35                # share of returned units failing inspection (warranty-driven)
  transit_damage_rate: 0.004           # share of shipped units damaged in transit
  dispositions: {SCRAP: 0.20, RETURN_TO_SUPPLIER: 0.45, REPAIR: 0.35}   # defective stock, decided weekly (1D)

suppliers:
  hubs: [Noida, Chennai, Pune, Bengaluru, Hosur]   # cities in config/seed/cities.yaml
  name_suffixes: [Electronics, Technologies, Electricals, Digital Systems, Components]
  monthly_cost_drift: [0.002, 0.006]  # reference-cost inflation per month (min, max)
  lead_time_days: [5, 21]

pricing:
  list_price_ratio: [0.82, 0.92]       # list price (ex-GST, trade) as a share of MRP excluding GST
  gross_margin: [0.16, 0.28]           # (list price - supplier cost) / list price

# Brands: tier drives the price band; categories = the level-1 categories the brand sells in.
brands:
  - {code: VOLTRIX, name: Voltrix, tier: MID, categories: [ELEC-AUD, ELEC-MOB, ELEC-CMP]}
  - {code: AURALYN, name: Auralyn, tier: PREMIUM, categories: [ELEC-AUD]}
  - {code: NIMBUZ, name: Nimbuz, tier: ECONOMY, categories: [ELEC-AUD, ELEC-MOB, ELEC-SAP]}
  - {code: ORBITRON, name: Orbitron, tier: PREMIUM, categories: [ELEC-MOB, ELEC-CMP, ELEC-TV]}
  - {code: PIXORA, name: Pixora, tier: MID, categories: [ELEC-TV, ELEC-CMP]}
  - {code: TEJAS-DIGI, name: Tejas Digital, tier: ECONOMY, categories: [ELEC-TV, ELEC-MOB, ELEC-CMP]}
  - {code: COOLVAYU, name: Coolvayu, tier: MID, categories: [ELEC-APL]}
  - {code: HIMSHEETAL, name: Himsheetal Appliances, tier: ECONOMY, categories: [ELEC-APL, ELEC-SAP]}
  - {code: GRANDORA, name: Grandora, tier: PREMIUM, categories: [ELEC-APL, ELEC-SAP]}
  - {code: RASOIMATE, name: RasoiMate, tier: MID, categories: [ELEC-SAP]}
  - {code: GLIDEX, name: Glidex, tier: MID, categories: [ELEC-MOB, ELEC-AUD]}
  - {code: SPARKO, name: Sparko, tier: ECONOMY, categories: [ELEC-CMP, ELEC-AUD]}

# Category tree (max 3 levels). Leaves define the product template:
#   share: relative share of the preset's product count; hsn + gst.before/after (rates around 22 Sep 2025;
#   after <= before so list price + GST stays within MRP, V-MD-18); uom (seed code); mrp per brand tier
#   (GST-inclusive, rupees); weight_kg / volume_litres ranges; warranty_months; shelf_life_days (expiry);
#   nouns for product names; optional variants (label, price_factor) and colours; optional seasonality.
name_series: [Pro, Max, Lite, Neo, Air, Plus, Prime, Ultra, Go, X]
categories:
  - code: ELEC-AUD
    name: Audio
    return_window_days: 7
    children:
      - {code: ELEC-AUD-EAR, name: Earbuds & Earphones, share: 10, hsn: "85183000", gst: {before: 18, after: 18}, uom: PCS,
