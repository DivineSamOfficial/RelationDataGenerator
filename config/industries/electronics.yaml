         warranty_months: 12, nouns: [Wireless Earbuds, Neckband Earphones, Wired Earphones], colours: [Black, White, Blue]}
      - {code: ELEC-AUD-HDP, name: Headphones, share: 4, hsn: "85183000", gst: {before: 18, after: 18}, uom: PCS,
