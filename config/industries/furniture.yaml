# Industry pack: Furniture (added at the owner's request, 2026-11-10; not in the original 1A list).
# Format: see electronics.yaml. High value, very bulky, long supplier lead times, higher transit
# damage, offices / hotels / builders as B2B buyers, festive, wedding and new-financial-year peaks.
# Brand names are invented; GST rates are illustrative (D17 pattern: bamboo/cane 12% -> 5%), not tax advice.

code: furniture
name: Furniture
business_unit: {code: FURN, name: Furniture}

customers:
  b2b_sales_share: 0.55                # offices, hotels, co-working, builders' show flats
  credit_terms:
    B2B: {NET30: 0.45, NET45: 0.30, NET15: 0.15, IMMEDIATE: 0.10}
    B2C: {ADVANCE: 0.80, COD: 0.20}
  sales_channels:
    B2B: {FIELD_SALES: 0.55, PHONE: 0.15, WEBSITE: 0.20, WHATSAPP: 0.10}
    B2C: {WEBSITE: 0.30, MOBILE_APP: 0.15, MARKETPLACE: 0.25, RETAIL_STORE: 0.25, WHATSAPP: 0.05}
  marketing_channels:
    B2B: {FIELD_SALES: 0.45, TRADE_SHOW: 0.20, REFERRAL: 0.20, DIRECT: 0.10, GOOGLE_ADS: 0.05}
    B2C: {GOOGLE_ADS: 0.20, FACEBOOK: 0.15, INSTAGRAM: 0.15, YOUTUBE: 0.10, MARKETPLACE_ADS: 0.10,
          ORGANIC_SEARCH: 0.10, EMAIL: 0.05, REFERRAL: 0.08, DIRECT: 0.07}
marketplace_commission_percent: 14

seasonality: [1.05, 1.00, 1.05, 1.15, 0.95, 0.80, 0.80, 0.85, 0.95, 1.25, 1.20, 0.95]
events:
  - {name: New Year Home Refresh, month: 1, day: 5, days: 14, uplift: 1.15, channels: [FACEBOOK, GOOGLE_ADS]}
  - {name: New Office Season, month: 4, day: 1, days: 21, uplift: 1.20, channels: [GOOGLE_ADS, EMAIL]}
  - {name: Furniture Expo, month: 2, day: 20, days: 4, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Monsoon Clearance, month: 7, day: 10, days: 14, uplift: 1.10, channels: [EMAIL, MARKETPLACE_ADS]}
  - {name: Big Festive Sale, month: 9, day: 25, days: 14, uplift: 1.40, channels: [MARKETPLACE_ADS, YOUTUBE]}
  - {name: Diwali Home Makeover, month: 10, day: 15, days: 21, uplift: 1.50, channels: [INSTAGRAM, FACEBOOK, GOOGLE_ADS]}
  - {name: Wedding Home Setup, month: 11, day: 20, days: 30, uplift: 1.20, channels: [INSTAGRAM, EMAIL]}
  - {name: Year End Sale, month: 12, day: 22, days: 9, uplift: 1.15, channels: [FACEBOOK, MARKETPLACE_ADS]}

returns:
  b2c_return_rate: 0.04
  b2b_return_rate: 0.015
  defective_share: 0.45                # most returns are damage or finish defects
  transit_damage_rate: 0.02            # scratches, broken glass tops, crushed corners

suppliers:
  hubs: [Jodhpur, Udaipur, New Delhi, Bengaluru, Kolkata, Kochi, Ahmedabad]
  name_suffixes: [Furniture Works, Woodcraft, Interiors, Furnishers, Timber Industries, Seating Systems]
  monthly_cost_drift: [0.003, 0.008]
  lead_time_days: [10, 45]

pricing:
  list_price_ratio: [0.70, 0.85]
  gross_margin: [0.25, 0.40]

brands:
  - {code: LAKDICRAFT, name: Lakdi Craft, tier: MID, categories: [FURN-LIV, FURN-BED, FURN-DIN]}
  - {code: SHEESHAMHS, name: Sheesham House, tier: PREMIUM, categories: [FURN-LIV, FURN-BED, FURN-DIN]}
  - {code: AARAM, name: Aaram Living, tier: MID, categories: [FURN-LIV, FURN-BED]}
  - {code: WOODVISTA, name: Woodvista, tier: ECONOMY, categories: [FURN-LIV, FURN-BED, FURN-DIN, FURN-OFF]}
  - {code: OFFICENEST, name: OfficeNest, tier: MID, categories: [FURN-OFF]}
  - {code: KURSIKRAFT, name: Kursi Kraft, tier: PREMIUM, categories: [FURN-OFF, FURN-DIN]}
  - {code: SUKHNIDRA, name: Sukh Nidra Mattresses, tier: MID, categories: [FURN-BED]}
  - {code: VANACRAFT, name: Vana Craft, tier: ECONOMY, categories: [FURN-OUT]}
  - {code: BAANSURI, name: Baansuri Cane Works, tier: MID, categories: [FURN-OUT, FURN-LIV]}
  - {code: KS-FURN, name: KS Furniture Basics, tier: ECONOMY, private_label: true, categories: [FURN-OFF, FURN-OUT]}

name_series: [Heritage, Nordic, Urban, Classic, Royal, Comfort, Studio, Maharaja, Slim, Modular]
categories:
