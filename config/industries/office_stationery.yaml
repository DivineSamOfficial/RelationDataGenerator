# Industry pack: Office & Stationery (1A §8.3). Format: see electronics.yaml.
# Institutional B2B (offices, schools, colleges), academic-year (June) and FY-end (March) peaks.
# Brand names are invented; GST rates are illustrative (D17 pattern: e.g. exercise books and pencils
# 12% -> 0%), not tax advice.

