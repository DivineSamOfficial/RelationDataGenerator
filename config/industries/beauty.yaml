# Industry pack: Beauty & Personal Care (1A §8.3). Format: see electronics.yaml.
# B2C-heavy, Instagram-driven, products with expiry (batch-tracked), wedding and festive peaks.
# Brand names are invented; GST rates are illustrative (D17 pattern), not tax advice.

code: beauty
name: Beauty & Personal Care
business_unit: {code: BEAU, name: Beauty & Personal Care}

customers:
  b2b_sales_share: 0.35                # D2 override: B2C-heavy
  credit_terms:
    B2B: {NET15: 0.40, NET30: 0.45, IMMEDIATE: 0.15}
    B2C: {ADVANCE: 0.80, COD: 0.20}
  sales_channels:
    B2B: {FIELD_SALES: 0.40, WHATSAPP: 0.30, PHONE: 0.15, WEBSITE: 0.15}
    B2C: {MOBILE_APP: 0.30, WEBSITE: 0.20, MARKETPLACE: 0.30, RETAIL_STORE: 0.15, WHATSAPP: 0.05}
  marketing_channels:
    B2B: {FIELD_SALES: 0.45, REFERRAL: 0.25, TRADE_SHOW: 0.10, DIRECT: 0.20}
    B2C: {INSTAGRAM: 0.32, YOUTUBE: 0.12, FACEBOOK: 0.10, GOOGLE_ADS: 0.08, MARKETPLACE_ADS: 0.10,
          ORGANIC_SEARCH: 0.08, EMAIL: 0.06, REFERRAL: 0.08, DIRECT: 0.06}
marketplace_commission_percent: 18

seasonality: [1.15, 1.10, 0.95, 0.90, 0.95, 0.85, 0.85, 0.90, 0.95, 1.15, 1.20, 1.05]
events:
  - {name: Valentine Glow Week, month: 2, day: 7, days: 8, uplift: 1.30, channels: [INSTAGRAM, YOUTUBE]}
  - {name: Holi Colour Care, month: 3, day: 5, days: 10, uplift: 1.15, channels: [INSTAGRAM, FACEBOOK]}
  - {name: Summer Skin Fest, month: 5, day: 1, days: 21, uplift: 1.15, channels: [INSTAGRAM, GOOGLE_ADS]}
  - {name: Monsoon Hair Care, month: 7, day: 10, days: 14, uplift: 1.10, channels: [YOUTUBE, EMAIL]}
  - {name: Big Festive Sale, month: 9, day: 25, days: 14, uplift: 1.45, channels: [MARKETPLACE_ADS, INSTAGRAM]}
  - {name: Diwali Gifting, month: 10, day: 20, days: 14, uplift: 1.50, channels: [INSTAGRAM, FACEBOOK, EMAIL]}
  - {name: Wedding Season Edit, month: 11, day: 20, days: 30, uplift: 1.25, channels: [INSTAGRAM, YOUTUBE]}
  - {name: Salon Partner Meet, month: 1, day: 15, days: 3, uplift: 1.10, channels: [TRADE_SHOW]}

returns:
  b2c_return_rate: 0.04
  b2b_return_rate: 0.01
  defective_share: 0.25
  transit_damage_rate: 0.006           # leaking bottles, crushed packs
  dispositions: {SCRAP: 0.70, RETURN_TO_SUPPLIER: 0.30, REPAIR: 0.00}   # defective stock, decided weekly (1D)

suppliers:
  hubs: [Mumbai, Ahmedabad, Vadodara, Bhiwandi, Bengaluru, Kolkata]
  name_suffixes: [Cosmetics, Herbals, Personal Care, Chemicals, Fragrances]
  monthly_cost_drift: [0.003, 0.008]
  lead_time_days: [4, 14]

pricing:
  list_price_ratio: [0.70, 0.85]       # retail margins are wide in beauty
  gross_margin: [0.25, 0.40]

brands:
  - {code: SAUNDARYA, name: Saundarya Naturals, tier: MID, categories: [BEAU-HAIR, BEAU-SKIN, BEAU-BATH]}
  - {code: KESHVI, name: Keshvi, tier: ECONOMY, categories: [BEAU-HAIR, BEAU-BATH, BEAU-ORAL]}
  - {code: LUMERA, name: Lumera Paris, tier: PREMIUM, categories: [BEAU-SKIN, BEAU-MKP, BEAU-FRG]}
