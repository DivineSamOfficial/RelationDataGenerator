# Industry pack: Industrial & MRO - maintenance, repair and operations supplies (1A §8.3).
# Format: see electronics.yaml. B2B-only (b2b_sales_share 1.0, so no B2C sections): factories,
# contractors and facility managers buying through field sales on long credit terms; low returns.
# Brand names are invented; GST rates are illustrative, not tax advice.

code: industrial_mro
name: Industrial & MRO
business_unit: {code: INDL, name: Industrial & MRO}

customers:
  b2b_sales_share: 1.0
  credit_terms:
    B2B: {NET45: 0.35, NET60: 0.30, NET30: 0.30, 2_10_NET30: 0.05}
  sales_channels:
    B2B: {FIELD_SALES: 0.60, PHONE: 0.20, WEBSITE: 0.10, WHATSAPP: 0.10}
  marketing_channels:
    B2B: {FIELD_SALES: 0.50, TRADE_SHOW: 0.20, REFERRAL: 0.15, DIRECT: 0.10, GOOGLE_ADS: 0.05}
marketplace_commission_percent: 0

seasonality: [1.00, 1.05, 1.25, 0.95, 0.95, 0.85, 0.85, 0.95, 1.00, 0.95, 1.05, 1.15]   # FY-end and Q4 maintenance
events:
  - {name: Industrial Expo, month: 1, day: 25, days: 4, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Year End Capex Push, month: 3, day: 1, days: 25, uplift: 1.20, channels: [GOOGLE_ADS]}
  - {name: Monsoon Safety Drive, month: 6, day: 15, days: 21, uplift: 1.10, channels: [GOOGLE_ADS]}
  - {name: Maintenance Shutdown Season, month: 11, day: 15, days: 30, uplift: 1.15, channels: [GOOGLE_ADS]}
  - {name: Contractor Meet, month: 9, day: 10, days: 3, uplift: 1.10, channels: [TRADE_SHOW]}
  - {name: Safety Week, month: 3, day: 4, days: 7, uplift: 1.10, channels: [GOOGLE_ADS, TRADE_SHOW]}

returns:
  b2c_return_rate: 0
  b2b_return_rate: 0.01
  defective_share: 0.40
  transit_damage_rate: 0.003

suppliers:
  hubs: [Rajkot, Ludhiana, Coimbatore, Pune, Jamshedpur, Faridabad, Chennai]
  name_suffixes: [Engineering, Tools, Industrial Supplies, Cables, Fasteners, Lubricants]
  monthly_cost_drift: [0.003, 0.008]
  lead_time_days: [5, 30]

pricing:
  list_price_ratio: [0.70, 0.85]       # big institutional discounts off MRP
  gross_margin: [0.15, 0.30]

brands:
  - {code: VAJRA, name: Vajra Tools, tier: MID, categories: [INDL-PWT, INDL-HND]}
  - {code: LOHAPURI, name: Lohapuri, tier: ECONOMY, categories: [INDL-HND, INDL-FST]}
  - {code: TORQLINE, name: Torqline, tier: PREMIUM, categories: [INDL-PWT, INDL-HND]}
  - {code: SURAKSHA, name: Suraksha Gear, tier: MID, categories: [INDL-SAF]}
  - {code: KAVACH, name: Kavach Safety, tier: ECONOMY, categories: [INDL-SAF]}
  - {code: TARANG, name: Tarang Cables, tier: MID, categories: [INDL-ELE]}
  - {code: SNEHAN, name: Snehan Lubricants, tier: MID, categories: [INDL-LUB]}
  - {code: CHAKRA, name: Chakra Bearings, tier: PREMIUM, categories: [INDL-FST, INDL-ELE]}
  - {code: FASTENIX, name: Fastenix, tier: ECONOMY, categories: [INDL-FST]}
  - {code: KS-INDL, name: KS Industrial, tier: ECONOMY, private_label: true, categories: [INDL-HND, INDL-SAF, INDL-LUB, INDL-ELE]}

name_series: [Pro, Heavy Duty, Industrial, HD, Max, Titan, Prime, Series 5, Series 7, Plus]
categories:
  - code: INDL-PWT
    name: Power Tools
    return_window_days: 7
    children:
      - {code: INDL-PWT-DRL, name: Drills, share: 5, hsn: "84672100", gst: {before: 18, after: 18}, uom: PCS,
         mrp: {MID: [2999, 7999], PREMIUM: [8000, 24999]}, weight_kg: [1.5, 4.0], volume_litres: [4, 12],
         warranty_months: 12, nouns: [Impact Drill 13mm, Cordless Drill Driver, Rotary Hammer Drill]}
