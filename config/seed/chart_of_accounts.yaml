# Accounts generated from master data (1B §5 "derived"). {seq} is a 2-digit sequence (01-99) and
# {component} the GST digit: 1 = CGST, 2 = SGST or UTGST, 3 = IGST.
derived:
  bank_current:   {code: "101{seq}", name: "Bank - {name}", type: ASSET, parent: "10100", control: BANK, cash_flow: CASH}
  petty_cash:     {code: "102{seq}", name: "Petty Cash - {name}", type: ASSET, parent: "10100", control: BANK, cash_flow: CASH}
  cash_credit:    {code: "230{seq}", name: "Cash Credit Facility - {name}", type: LIABILITY, parent: "20000", control: BANK, cash_flow: FINANCING}
  gst_input:      {code: "13{seq}{component}", name: "Input {tax} - {state}", type: ASSET, parent: "13000", control: GST, cash_flow: OPERATING}
  gst_output:     {code: "22{seq}{component}", name: "Output {tax} - {state}", type: LIABILITY, parent: "22000", control: GST, cash_flow: OPERATING}
  bu_revenue:     {code: "41{seq}0", name: "Sales - {name}", type: REVENUE, parent: "40000", cash_flow: NOT_APPLICABLE}
  bu_returns:     {code: "42{seq}0", name: "Sales Returns - {name}", type: REVENUE, parent: "40000", normal: DEBIT, cash_flow: NOT_APPLICABLE}
  bu_cogs:        {code: "51{seq}0", name: "COGS - {name}", type: COGS, parent: "50000", cash_flow: NOT_APPLICABLE}

# Expense categories (1B §4.8) and the GL account each posts to (by code). default_gst_rate null =
# outside GST (salaries, electricity). is_itc_eligible false = blocked credit (GST goes to the expense).
expense_categories:
  - {category_code: RENT, category_name: Rent, category_group: OCCUPANCY, account: "60300", default_gst_rate: "18", is_itc_eligible: true, recurrence: MONTHLY, payee_type: SUPPLIER}
  - {category_code: ELECTRICITY, category_name: Electricity, category_group: UTILITIES, account: "60400", default_gst_rate: null, is_itc_eligible: false, recurrence: MONTHLY, payee_type: SUPPLIER}
