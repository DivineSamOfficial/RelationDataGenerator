# Chart of accounts (1B §5). Account codes live here, never in Python (D16): posting rules find
# accounts by system_role, business unit, GSTIN, expense category or bank account.
#
# Fields: code, name, type (account_type_code), parent (code; omitted at level 1), postable,
# role (system_role), control (AR / AP / INVENTORY / BANK / GST), normal (only when it differs from
# the type's, i.e. contra accounts), cash_flow (D78). requires_cost_center is TRUE for every postable
# P&L account (1B §4.9) and is derived by the loader, not written here.

accounts:
  # --- 1 Assets ---------------------------------------------------------------------------------
  - {code: "10000", name: Current Assets, type: ASSET, postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "10100", name: Cash and Bank, type: ASSET, parent: "10000", postable: false, cash_flow: CASH}
  - {code: "10300", name: Payment Clearing - Cards/UPI, type: ASSET, parent: "10000", postable: true, role: PAYMENT_CLEARING, cash_flow: OPERATING}
  - {code: "11000", name: Trade Receivables, type: ASSET, parent: "10000", postable: true, role: AR_CONTROL, control: AR, cash_flow: OPERATING}
  - {code: "12000", name: Inventory, type: ASSET, parent: "10000", postable: true, role: INVENTORY, control: INVENTORY, cash_flow: OPERATING}
  - {code: "12100", name: Inventory in Transit, type: ASSET, parent: "10000", postable: true, role: INVENTORY_IN_TRANSIT, cash_flow: OPERATING}
  - {code: "13000", name: GST Input Credit, type: ASSET, parent: "10000", postable: false, cash_flow: OPERATING}
  - {code: "14000", name: Advances to Suppliers, type: ASSET, parent: "10000", postable: true, role: SUPPLIER_ADVANCES, cash_flow: OPERATING}
  - {code: "14100", name: Prepaid Expenses, type: ASSET, parent: "10000", postable: true, cash_flow: OPERATING}
  - {code: "15000", name: Non-current Assets, type: ASSET, postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "15100", name: Furniture & Fixtures, type: ASSET, parent: "15000", postable: true, cash_flow: INVESTING}
  - {code: "15200", name: Computers & Equipment, type: ASSET, parent: "15000", postable: true, cash_flow: INVESTING}
  - {code: "15900", name: Accumulated Depreciation, type: ASSET, parent: "15000", postable: true, role: ACCUMULATED_DEPRECIATION, normal: CREDIT, cash_flow: OPERATING}
  # --- 2 Liabilities ----------------------------------------------------------------------------
  - {code: "20000", name: Current Liabilities, type: LIABILITY, postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "21000", name: Trade Payables, type: LIABILITY, parent: "20000", postable: true, role: AP_CONTROL, control: AP, cash_flow: OPERATING}
  - {code: "21100", name: Goods Received Not Invoiced, type: LIABILITY, parent: "20000", postable: true, role: GRNI, cash_flow: OPERATING}
  - {code: "21200", name: Accrued Expenses, type: LIABILITY, parent: "20000", postable: true, role: ACCRUED_EXPENSES, cash_flow: OPERATING}
  - {code: "21300", name: Customer Advances, type: LIABILITY, parent: "20000", postable: true, role: CUSTOMER_ADVANCES, cash_flow: OPERATING}
  - {code: "21400", name: Salaries Payable, type: LIABILITY, parent: "20000", postable: true, role: SALARIES_PAYABLE, cash_flow: OPERATING}
  - {code: "22000", name: GST Output Liability, type: LIABILITY, parent: "20000", postable: false, cash_flow: OPERATING}
  # --- 3 Equity ---------------------------------------------------------------------------------
  - {code: "30000", name: Equity, type: EQUITY, postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "30100", name: Share Capital, type: EQUITY, parent: "30000", postable: true, role: SHARE_CAPITAL, cash_flow: FINANCING}
  - {code: "30200", name: Retained Earnings, type: EQUITY, parent: "30000", postable: true, role: RETAINED_EARNINGS, cash_flow: NOT_APPLICABLE}
  - {code: "30300", name: Opening Balance Equity, type: EQUITY, parent: "30000", postable: true, role: OPENING_BALANCE_EQUITY, cash_flow: NOT_APPLICABLE}
  # --- 4 Revenue --------------------------------------------------------------------------------
  - {code: "40000", name: Revenue, type: REVENUE, postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "44000", name: Shipping Charges Recovered, type: REVENUE, parent: "40000", postable: true, role: SHIPPING_INCOME, cash_flow: NOT_APPLICABLE}
  - {code: "49000", name: Other Income, type: REVENUE, parent: "40000", postable: false, cash_flow: NOT_APPLICABLE}
  - {code: "49100", name: Interest Income, type: REVENUE, parent: "49000", postable: true, role: INTEREST_INCOME, cash_flow: NOT_APPLICABLE}
  - {code: "49200", name: Rounding Off, type: REVENUE, parent: "49000", postable: true, role: ROUNDING_OFF, cash_flow: NOT_APPLICABLE}
  - {code: "49300", name: Inventory Adjustment Gains, type: REVENUE, parent: "49000", postable: true, role: INVENTORY_ADJUSTMENT_GAIN, cash_flow: NOT_APPLICABLE}
  # --- 5 Cost of goods sold ---------------------------------------------------------------------
