  - {code: "61500", name: Office Expenses, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61600", name: Insurance, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61700", name: Packaging Materials, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61900", name: Depreciation, type: EXPENSE, parent: "60000", postable: true, role: DEPRECIATION, cash_flow: NOT_APPLICABLE}
  - {code: "62000", name: Freight Outward & Courier, type: EXPENSE, parent: "60000", postable: true, role: FREIGHT_OUTWARD, cash_flow: NOT_APPLICABLE}
  - {code: "62100", name: Marketplace Commission, type: EXPENSE, parent: "60000", postable: true, role: MARKETPLACE_COMMISSION, cash_flow: NOT_APPLICABLE}
