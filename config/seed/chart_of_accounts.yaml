  - {code: "60200", name: Staff Welfare, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60300", name: Rent, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60400", name: Electricity & Water, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60500", name: Internet & Telephone, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60600", name: Software Subscriptions, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60700", name: AI Tool Subscriptions, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60800", name: Cloud Hosting, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "60900", name: Repairs & Maintenance, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61000", name: Security & Housekeeping, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61100", name: Travel & Conveyance, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
  - {code: "61200", name: Advertising & Marketing, type: EXPENSE, parent: "60000", postable: true, cash_flow: NOT_APPLICABLE}
