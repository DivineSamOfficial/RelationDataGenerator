# Indian states and union territories with their GST state codes (1B §4.1 `states`).
# 36 states/UTs + 97 "Other Territory"; retired codes (25, 28) are excluded.
# state_code: vehicle-registration style 2-letter code (also used in document numbers and vehicle numbers).
# intra_state_tax_component: UTs without a legislature use UTGST; Delhi, Puducherry and J&K use SGST.
states:
  - {gst_state_code: "01", state_code: JK, state_name: Jammu and Kashmir, is_union_territory: true, intra_state_tax_component: SGST, region: NORTH}
  - {gst_state_code: "02", state_code: HP, state_name: Himachal Pradesh, is_union_territory: false, intra_state_tax_component: SGST, region: NORTH}
  - {gst_state_code: "03", state_code: PB, state_name: Punjab, is_union_territory: false, intra_state_tax_component: SGST, region: NORTH}
