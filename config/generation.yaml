# Data generation settings (Phase 3). The engine holds the mechanisms; the numbers live here (1G §2.3).
#
# A run uses one preset, optionally adjusted with overrides (CLI: --set volumes.customers_b2b=500).
# Unknown keys are rejected, so a typo can't silently fall back to a default.
# Later Phase 3 steps add their own sections (demand, procurement, scenarios, ...).

defaults:
  preset: medium
  fiscal_year_start_month: 4      # April (D7); must match companies.fy_start_month
  batch_size: 1000                # rows per multi-row INSERT statement (1G §2.5)
  gst_rate_revision: true         # apply the 22 Sep 2025 GST rate change from the industry packs (D17)
  history:
    start_date: null              # first simulated day (YYYY-MM-DD); null = end_date minus the preset's history_months
    end_date: null                # last simulated day; null = yesterday (IST). Today or later needs allow_future (D68)
    allow_future: false

# Volumes from Part 1B §3.4. Medium is the design baseline; Small ≈ ÷5 and Large ≈ ×5 for the tables that scale.
# suppliers = goods suppliers + the structural service suppliers (≈60, see config/seed/reference.yaml).
# Warehouses (5 DCs + 3 stores) are a setup input, not a preset value.
presets:
  small:
    history_months: 3
    volumes:
      customers_b2b: 240
      customers_b2c: 1160
      suppliers: 100            # goods + ~60 structural service suppliers (landlords, utilities, carriers …)
      products: 400
      employees: 36
      locations_per_dc: 80
      locations_per_store: 12
      orders_per_day: 14          # average base demand before seasonality and trend
  medium:
    history_months: 24
    volumes:
      customers_b2b: 1200
      customers_b2c: 5800
      suppliers: 260
      products: 2000
      employees: 180
      locations_per_dc: 400
      locations_per_store: 60
      orders_per_day: 70          # ≈ 50,000 orders over two years (master prompt §7)
  large:
    history_months: 36
    volumes:
      customers_b2b: 6000
      customers_b2c: 29000
      suppliers: 1300
      products: 10000
      employees: 900
      locations_per_dc: 2000
      locations_per_store: 300
      orders_per_day: 350

# Company identity (1B §3.2 "Setup"): fixed for a workspace once generated (A2). Cities must be in
# config/seed/cities.yaml. One GSTIN per state with a warehouse (D3); the HQ state must be one of them.
setup:
  hq_city: Bengaluru
  distribution_centres: [Bengaluru, Mumbai, New Delhi, Chennai, Kolkata]
  stores: [Bengaluru, Mumbai, New Delhi]     # retail stores in DC cities, replenished by that DC
  company_age_years: [6, 12]                # incorporated this many years before the history starts
  cash_credit_limit: 50000000               # overdraft limit of the cash-credit account (rupees)

# Organisation (1B §4.2): bands per job level and the central departments. Warehouse staffing follows
# 1B: per DC 1 manager, 2-3 leads and staff; per store 1 manager and staff. The preset's employee count
# is the target; central departments get the remainder by weight.
organisation:
  job_levels:                                # monthly gross salary range and approval limit (rupees)
    EXECUTIVE: {salary: [600000, 900000], approval_limit: 50000000}
    HEAD:      {salary: [250000, 450000], approval_limit: 5000000}
    MANAGER:   {salary: [90000, 180000],  approval_limit: 1000000}
    LEAD:      {salary: [45000, 80000],   approval_limit: 200000}
    STAFF:     {salary: [18000, 40000],   approval_limit: 0}
  warehouse_staff_share: 0.60                # of employees beyond the fixed roles: DC and store staff
  departments:                               # central departments: weight of the remaining staff, titles
    PUR: {weight: 0.12, head: Head of Procurement, manager: Purchase Manager, staff: Buyer}
    LOG: {weight: 0.10, head: Head of Logistics, manager: Logistics Manager, staff: Logistics Coordinator}
    SAL: {weight: 0.30, head: Head of Sales, manager: Regional Sales Manager, staff: Sales Executive}
    MKT: {weight: 0.08, head: Head of Marketing, manager: Marketing Manager, staff: Marketing Executive}
    CS:  {weight: 0.12, head: Head of Customer Service, manager: Customer Service Manager, staff: Customer Support Associate}
    FIN: {weight: 0.14, head: Chief Financial Officer, manager: Finance Manager, staff: Accountant}
    HR:  {weight: 0.06, head: Head of HR & Admin, manager: HR Manager, staff: HR Executive}
    IT:  {weight: 0.08, head: Head of IT, manager: IT Manager, staff: Systems Engineer}
  warehouse_titles:
    WHO: {head: Head of Warehouse Operations, dc_manager: Warehouse Manager, lead: Shift Lead, staff: Warehouse Associate}
    store: {manager: Store Manager, staff: Sales Associate}
  chief_executive: Chief Executive Officer

# Master-data behaviour (1B §4.4-§4.7). Mixes are shares that add up to 1.
master_data:
  customers:
    b2b_segments: {RETAILER: 0.55, WHOLESALER: 0.15, CORPORATE: 0.15, INSTITUTION: 0.10, WORKSHOP: 0.05}
    b2b_registration: {REGISTERED: 0.85, COMPOSITION: 0.08, UNREGISTERED: 0.07}
    credit_limits:                         # rupees, per segment (customers on credit terms only)
      RETAILER: [100000, 500000]
      WHOLESALER: [1000000, 5000000]
      CORPORATE: [500000, 2500000]
      INSTITUTION: [500000, 2000000]
      WORKSHOP: [100000, 500000]
    name_suffixes:
      RETAILER: [Traders, Stores, Enterprises, Mart, Retail, Agencies]
      WHOLESALER: [Distributors, Wholesale, Trading Co, "& Sons"]
      CORPORATE: [Technologies, Solutions, Industries, Infra, Services]
      INSTITUTION: [Public School, Hospital, Institute, College, Hotels]
      WORKSHOP: [Engineering Works, Auto Works, Fabricators, Service Centre]
    extra_shipping_address_share: 0.30     # B2B customers with 1-3 more delivery addresses
    campaign_attribution: {B2B: 0.15, B2C: 0.35}   # acquisitions credited to a campaign
    acquisition_mean_years: 2.0            # customers joined on average this long before day 0
    warehouse_region_weight: 3.0           # cities in a region with a warehouse get this weight multiplier
  suppliers:
    goods_registration: {REGISTERED: 0.90, COMPOSITION: 0.05, UNREGISTERED: 0.05}
    msme_share: 0.35                       # MSME suppliers must be paid within 45 days (V-MD-14)
    dispatch_address_share: 0.40
    per_product: [2, 5]                    # approved suppliers per product (V-MD-15: at least 2)
  campaigns:
    history_years: 2                       # past campaigns generated for this many years before day 0
    cancelled_share: 0.05
    budget: [200000, 1500000]              # rupees per campaign, before the event's uplift

# Daily engine (1G §2.2). Calendar: warehouses close on the weekly off day and national holidays (MM-DD).
daily:
  weekly_off: [SUNDAY]
  national_holidays: ["01-26", "08-15", "10-02"]   # Republic Day, Independence Day, Gandhi Jayanti
  period_close_day: 7              # a month is closed on this day of the next month (or the next working day)
  progress_every_days: 7           # progress row update frequency (the control panel polls it)
  new_products_per_year: 0.08      # launches per year as a share of the catalogue (1B: ~15% over the history)
  discontinued_per_year: 0.04      # 1B: 3-5% of products discontinued per year
  campaign_lead_days: 30           # campaigns are created this long before they start
